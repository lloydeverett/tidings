[package]
name = "tidings"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Text files for an application in config, data and cache areas, written through all-or-nothing commits, with a change feed."
readme = "README.md"

[features]
default = ["fs", "sqlite"]
# The filesystem Backend.
fs = [
    "dep:atomic-write-file",
    "dep:etcetera",
    "dep:notify",
    "dep:notify-debouncer-full",
    "tokio/macros",
    "tokio/time",
]
# The SQLite Backend.
sqlite = ["dep:etcetera", "dep:rusqlite", "tokio/time"]
# `blocking::Store`, for synchronous code.
blocking = []
# Failure points and helpers for tidings' own tests.
testing = []

[dependencies]
atomic-write-file = { version = "0.3.1", optional = true }
caseless = "0.2.2"
etcetera = { version = "0.11.0", optional = true }
jiff = "0.2.37"
notify = { version = "8.2.0", optional = true }
notify-debouncer-full = { version = "0.7.0", optional = true }
relative-path = "2.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
sanitize-filename = "0.6.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
tracing = "0.1.44"
unicode-normalization = "0.1.25"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
# tidings' own tests always build it with `testing`, so a plain `cargo test` runs the tests that
# need it. Dev-dependencies don't reach normal builds, or crates that depend on tidings.
tidings = { path = ".", default-features = false, features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
